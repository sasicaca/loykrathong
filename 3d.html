<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>งานวัดลอยกระทง 3D (ฉากทดลอง)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0d0b2e;font-family:Mali,"Leelawadee UI",sans-serif;color:#fff2d6;user-select:none}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  .pill{background:rgba(40,22,48,.82);border:2px solid #e9b872;border-radius:999px;padding:6px 18px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
  #help{position:fixed;left:14px;top:12px;font-size:14px;line-height:1.7;background:rgba(30,18,50,.6);border-radius:12px;padding:8px 14px;pointer-events:none}
  #help b{color:#ffd27a}
  #prompt{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);font-size:18px;font-weight:600;white-space:nowrap;display:none}
  #prompt kbd{background:#ffd27a;color:#3a2030;border-radius:6px;padding:1px 9px;margin-right:8px;font-family:inherit;font-weight:700}
  #toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);font-size:18px;font-weight:600;opacity:0;transition:opacity .35s;pointer-events:none}
  #err{position:fixed;left:14px;bottom:14px;color:#ff9a9a;font-size:13px;max-width:70vw}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="help"><b>ฉากทดลอง 3D</b><br><b>WASD / ลูกศร</b> เดิน · <b>E</b> ซื้อลูกชิ้นปิ้ง · <b>F</b> กิน · <b>ล้อเมาส์</b> ปรับมุมกล้อง</div>
<div id="toast" class="pill"></div>
<div id="prompt" class="pill"></div>
<div id="err"></div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
} }
</script>
<script>addEventListener('error', e => { document.getElementById('err').textContent = 'โหลดไม่สำเร็จ: ' + e.message; });</script>
<script type="module" src="game3d.js?v=8"></script>
</body>
</html>
